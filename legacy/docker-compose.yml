version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: aigent_postgres
    environment:
      POSTGRES_DB: aigent
      POSTGRES_USER: aigent
      POSTGRES_PASSWORD: aigent123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docs/postgresql-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    networks:
      - aigent_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: aigent_redis
    ports:
      - "6379:6379"
    networks:
      - aigent_network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aigent_backend
    environment:
      - DATABASE_URL=postgresql://aigent:aigent123@postgres:5432/aigent
      - REDIS_URL=redis://redis:6379
      - SECRET_KEY=your-secret-key-here
      - OPENAI_API_KEY=your-openai-key
      - OPENROUTER_API_KEY=your-openrouter-key
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app
    networks:
      - aigent_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aigent_frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - aigent_network
    command: npm run dev

volumes:
  postgres_data:

networks:
  aigent_network:
    driver: bridge
